name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  repository_dispatch:
    types: [rebuild-docs]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAPYRUS_VERSION: "1.5.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, gd, mbstring, zip, zlib
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Chromium for Mermaid
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install mermaid-cli
        run: npm install --global @mermaid-js/mermaid-cli

      - name: Download Papyrus PHAR
        run: |
          curl -fsSL -o papyrus.phar \
            "https://github.com/milon/papyrus/releases/download/v${PAPYRUS_VERSION}/papyrus.phar"
          chmod +x papyrus.phar
          php papyrus.phar --version

      - name: Resolve Chrome path
        id: chrome
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          if [[ -z "${PUPPETEER_EXECUTABLE_PATH:-}" ]]; then
            for candidate in google-chrome chrome chromium chromium-browser; do
              if command -v "$candidate" >/dev/null 2>&1; then
                PUPPETEER_EXECUTABLE_PATH="$(command -v "$candidate")"
                break
              fi
            done
          fi
          echo "path=${PUPPETEER_EXECUTABLE_PATH:-}" >> "$GITHUB_OUTPUT"
          echo "Using Chrome at: ${PUPPETEER_EXECUTABLE_PATH:-not set}"

      - name: Clone projects
        run: |
          mkdir -p work
          git clone --depth 1 https://github.com/milon/barcode.git work/barcode
          git clone --depth 1 https://github.com/milon/papyrus.git work/papyrus
          git clone --depth 1 https://github.com/milon/bohurupee.git work/bohurupee
          git clone --depth 1 https://github.com/milon/fuse.git work/fuse

      - name: Build barcode
        env:
          PAPYRUS_BIN: php ${{ github.workspace }}/papyrus.phar
        run: |
          (cd work/barcode && docs-src/bin/build-site)
          test -f work/barcode/docs/milon-barcode-site/index.html

      - name: Build papyrus handbook
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          (cd work/papyrus && composer install --no-interaction --prefer-dist)
          (cd work/papyrus && ./bin/papyrus build:site -d examples/the-papyrus-handbook -e docs)
          test -f work/papyrus/docs/the-papyrus-handbook-site/index.html

      - name: Build bohurupee
        env:
          PAPYRUS_BIN: php ${{ github.workspace }}/papyrus.phar
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          (cd work/bohurupee && docs/bin/build-site)
          test -f work/bohurupee/docs/export/bohurupee-site/index.html

      - name: Build fuse
        env:
          PAPYRUS_BIN: php ${{ github.workspace }}/papyrus.phar
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          (cd work/fuse && docs-src/bin/build-site)
          test -f work/fuse/docs/milon-fuse-site/index.html

      - name: Assemble publish tree
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish

          nest() {
            local src="$1"
            local dest="$2"
            mkdir -p "publish/${dest}"
            rsync -a --exclude CNAME "$src"/ "publish/${dest}/"
            test -f "publish/${dest}/index.html"
            grep -q "base href=\"/${dest}/\"" "publish/${dest}/index.html"
          }

          nest work/barcode/docs/milon-barcode-site barcode
          nest work/papyrus/docs/the-papyrus-handbook-site papyrus
          nest work/bohurupee/docs/export/bohurupee-site bohurupee
          nest work/fuse/docs/milon-fuse-site fuse

          printf '%s\n' 'oss.milon.im' > publish/CNAME
          touch publish/.nojekyll
          cat > publish/robots.txt <<'EOF'
User-agent: *
Allow: /

Sitemap: https://oss.milon.im/barcode/sitemap.xml
Sitemap: https://oss.milon.im/papyrus/sitemap.xml
Sitemap: https://oss.milon.im/bohurupee/sitemap.xml
Sitemap: https://oss.milon.im/fuse/sitemap.xml
EOF
          find publish -maxdepth 2 -type f | sort | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
